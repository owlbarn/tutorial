<section class="book-intro" aria-labelledby="book-title">
  <div class="book-intro-copy">
    <p class="chapter-number">ONLINE TUTORIAL</p>
    <h1 id="book-title">{{title}}</h1>
    <p class="book-subtitle">{{subtitle}}</p>
    {{intro}}
    <div class="book-actions">
      <a class="read-button" href="{{first}}">Start reading <span aria-hidden="true">→</span></a>
    </div>
  </div>
</section>
<section class="book-contents" id="contents" aria-labelledby="contents-title">
  <h2 id="contents-title">Contents</h2>
  {{contents}}
</section>
