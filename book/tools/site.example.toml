# Example configuration; the published one is site.toml in owlbarn/tutorial.
title = "Owl Online Tutorial"
subtitle = "Scientific computing in OCaml"
edition = "From the book OCaml Scientific Computing"
intro = """
<p>These chapters come from the book <em>OCaml Scientific Computing: Functional
Programming in Data Science and AI</em> by Liang Wang, Jianxin Zhao and Richard
Mortier. Every code example runs in the book's Docker image.</p>
"""
footer = """Text from <em>OCaml Scientific Computing</em> by Liang Wang, Jianxin Zhao and Richard Mortier.
Code: <a href="https://github.com/owlbarn/springer-book-code">springer-book-code</a>."""

# Published chapters, in reading order. Available: see manifest.json.
chapters = ["mathematics", "statistics", "linear-algebra", "ndarray", "diffequation", "signal",
            "algodiff", "optimisation", "regression", "neural-network",
            "reinforcement-learning"]

[links]
"Owl on GitHub" = "https://github.com/owlbarn/owl"
"Book code and Docker image" = "https://github.com/owlbarn/springer-book-code"

# Old page -> chapter slug. Unpublished or empty targets go to the contents page.
[redirects]
"chapters/maths.html" = "mathematics"
