name: Deploy the tutorial to Pages

# book/ is written by owlbarn/springer's CI (converted chapters and the site
# tools); site.toml chooses the published chapters. A push of either deploys.
on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.content.outputs.ready }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Check for book content
        id: content
        run: |
          if [ -f book/manifest.json ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::No book content yet; owlbarn/springer's CI publishes it. The current site is unchanged."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Assemble the site
        if: steps.content.outputs.ready == 'true'
        run: python3 book/tools/assemble.py --content book --config site.toml --out _site

      - name: Upload artifact
        if: steps.content.outputs.ready == 'true'
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    if: needs.build.outputs.ready == 'true'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
